name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate SKILL.md frontmatter
        run: python .github/scripts/check_skills.py
      - name: Pre-publish audit
        run: python github/scripts/project_audit.py --path . --strict --format text
      - name: Compile helper scripts
        run: python -m py_compile github/scripts/*.py
